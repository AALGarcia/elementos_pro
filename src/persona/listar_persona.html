<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Personas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>Gestión de Personas</h1>
      <button class="btn btn-success" onclick="abrirModalCrear()">
        <i class="bi bi-plus-circle me-2"></i>Crear Persona
      </button>
    </div>
    
    <!-- Contenedor de mensajes -->
    <div id="mensajesContainer"></div>
    
    <div class="table-responsive">
      <table class="table table-striped table-hover table-bordered" id="tablaPersonas">
        <thead class="table-dark">
          <tr>
            <th>Documento</th>
            <th>Nombres</th>
            <th>Apellidos</th>
            <th>Teléfono</th>
            <th>Roles</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal de Crear Persona -->
  <div class="modal fade" id="modalCrear" tabindex="-1" aria-labelledby="modalCrearLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalCrearLabel">Crear Nueva Persona</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="formCrear">
            <div class="mb-3">
              <label for="createDocumento" class="form-label">Documento <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="createDocumento" required>
            </div>
            <div class="mb-3">
              <label for="createNombres" class="form-label">Nombres <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="createNombres" required>
            </div>
            <div class="mb-3">
              <label for="createApellidos" class="form-label">Apellidos <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="createApellidos" required>
            </div>
            <div class="mb-3">
              <label for="createTelefono" class="form-label">Teléfono</label>
              <input type="tel" class="form-control" id="createTelefono">
            </div>
            <div class="mb-3">
              <label for="createRol" class="form-label">Rol <span class="text-danger">*</span></label>
              <select class="form-select" id="createRol" required>
                <option value="">Seleccione un rol</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-success" onclick="guardarPersona()">
            <i class="bi bi-save me-1"></i>Guardar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de Editar Persona -->
  <div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalEditarLabel">Editar Persona</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="formEditar">
            <div class="mb-3">
              <label for="editDocumento" class="form-label">Documento</label>
              <input type="text" class="form-control" id="editDocumento" readonly>
            </div>
            <div class="mb-3">
              <label for="editNombres" class="form-label">Nombres <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="editNombres" required>
            </div>
            <div class="mb-3">
              <label for="editApellidos" class="form-label">Apellidos <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="editApellidos" required>
            </div>
            <div class="mb-3">
              <label for="editTelefono" class="form-label">Teléfono</label>
              <input type="tel" class="form-control" id="editTelefono">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" onclick="guardarEdicion()">
            <i class="bi bi-save me-1"></i>Guardar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de Eliminar Persona -->
  <div class="modal fade" id="modalEliminar" tabindex="-1" aria-labelledby="modalEliminarLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title" id="modalEliminarLabel">Eliminar Persona</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-warning" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <strong>¿Está seguro que desea eliminar esta persona?</strong>
          </div>
          <p class="mb-2"><strong>Información:</strong></p>
          <ul class="list-unstyled ms-3">
            <li><strong>Documento:</strong> <span id="deleteDocumento"></span></li>
            <li><strong>Nombre:</strong> <span id="deleteNombre"></span></li>
            <li><strong>Teléfono:</strong> <span id="deleteTelefono"></span></li>
          </ul>
          <p class="text-danger mt-3"><small>Esta acción no se puede deshacer.</small></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" onclick="confirmarEliminacion()">
            <i class="bi bi-trash me-1"></i>Confirmar
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/personas.js"></script>
</body>
</html>
