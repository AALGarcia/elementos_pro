<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Elementos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>Gestión de Elementos</h1>
      <button class="btn btn-success" onclick="abrirModalCrear()">
        <i class="bi bi-plus-circle me-2"></i>Crear Elemento
      </button>
    </div>
    
    <!-- Contenedor de mensajes -->
    <div id="mensajesContainer"></div>
    
    <div class="table-responsive">
      <table class="table table-striped table-hover table-bordered" id="tablaElementos">
        <thead class="table-dark">
          <tr>
            <th>Placa</th>
            <th>Descripción</th>
            <th>Modelo</th>
            <th>Marca</th>
            <th>Serial</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal de Crear Elemento -->
  <div class="modal fade" id="modalCrear" tabindex="-1" aria-labelledby="modalCrearLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalCrearLabel">Crear Nuevo Elemento</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="formCrear">
            <div class="mb-3">
              <label for="createPlaca" class="form-label">Placa <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="createPlaca" required>
            </div>
            <div class="mb-3">
              <label for="createModelo" class="form-label">Modelo <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="createModelo" required>
            </div>
            <div class="mb-3">
              <label for="createMarca" class="form-label">Marca <span class="text-danger">*</span></label>
              <select class="form-select" id="createMarca" required>
                <option value="">Seleccione una marca</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="createSerial" class="form-label">Serial</label>
              <input type="text" class="form-control" id="createSerial">
            </div>
            <div class="mb-3">
              <label for="createDescripcion" class="form-label">Descripción</label>
              <input type="text" class="form-control" id="createDescripcion">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-success" onclick="guardarElemento()">
            <i class="bi bi-save me-1"></i>Guardar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de Editar Elemento -->
  <div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalEditarLabel">Editar Elemento</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="formEditar">
            <div class="mb-3">
              <label for="editPlaca" class="form-label">Placa</label>
              <input type="text" class="form-control" id="editPlaca" readonly>
            </div>
            <div class="mb-3">
              <label for="editModelo" class="form-label">Modelo <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="editModelo" required>
            </div>
            <div class="mb-3">
              <label for="editMarca" class="form-label">Marca <span class="text-danger">*</span></label>
              <select class="form-select" id="editMarca" required>
                <option value="">Seleccione una marca</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="editSerial" class="form-label">Serial</label>
              <input type="text" class="form-control" id="editSerial">
            </div>
            <div class="mb-3">
              <label for="editDescripcion" class="form-label">Descripción</label>
              <input type="text" class="form-control" id="editDescripcion">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" onclick="guardarEdicion()">
            <i class="bi bi-save me-1"></i>Guardar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de Eliminar Elemento -->
  <div class="modal fade" id="modalEliminar" tabindex="-1" aria-labelledby="modalEliminarLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title" id="modalEliminarLabel">Eliminar Elemento</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-warning" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <strong>¿Está seguro que desea eliminar este elemento?</strong>
          </div>
          <p class="mb-2"><strong>Información:</strong></p>
          <ul class="list-unstyled ms-3">
            <li><strong>Placa:</strong> <span id="deletePlaca"></span></li>
            <li><strong>Descripción:</strong> <span id="deleteDescripcion"></span></li>
            <li><strong>Modelo:</strong> <span id="deleteModelo"></span></li>
            <li><strong>Marca:</strong> <span id="deleteMarca"></span></li>
          </ul>
          <p class="text-danger mt-3"><small>Esta acción no se puede deshacer.</small></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" onclick="confirmarEliminacion()">
            <i class="bi bi-trash me-1"></i>Confirmar
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/elementos.js"></script>
</body>
</html>
